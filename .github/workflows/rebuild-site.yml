# Régénère les pages HTML du site après chaque publication d'article
# depuis Sveltia CMS (/admin).
#
# Sveltia n'écrit qu'un fichier Markdown dans content/coin-des-curieux/.
# Sans ce workflow, l'article existe dans le dépôt mais n'apparaît jamais
# sur la page « Le coin des curieux » : c'est generate.py qui l'y insère.
#
# Prérequis (voir 04_SCRIPTS/cms-auth-worker/DEPLOIEMENT.md, étape 4) :
# Settings → Actions → General → Workflow permissions → Read and write.

name: Régénérer le site

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'build/**'
      - 'img/**'
  workflow_dispatch:        # permet aussi de le lancer à la main

# CORRECTIF (27/08/2026) — cancel-in-progress: true.
# Avant : un run bloqué (ou juste lent) restait dans le groupe de concurrence
# et TOUS les push suivants (nouvel article Sveltia, upload manuel dans
# build/ ou img/) restaient à l'état "Queued" derrière lui, indéfiniment —
# c'est ce qui ressemblait à un "timeout à 15 minutes" côté Béatrice/Emilien.
# Avec cancel-in-progress: true, un nouveau push annule le run précédent au
# lieu de faire la queue derrière lui. Sans risque ici : generate.py est
# idempotent (régénère les 9 pages à partir de l'état actuel du dépôt), donc
# annuler un run devenu obsolète pour repartir sur le tout dernier commit
# est toujours correct.
concurrency:
  group: rebuild-site
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # CORRECTIF (27/08/2026) — garde-fou de durée.
    # Aucune limite n'était fixée : le timeout par défaut GitHub est de
    # 360 minutes (6h). Un run réellement bloqué (ex. git push qui attend
    # une main humaine, credentials mal chargés) consommait donc des heures
    # de minutes Actions en silence, et bloquait le groupe de concurrence
    # ci-dessus jusqu'à échouer. 10 minutes est largement suffisant : ce
    # job ne fait que parser 1 template, régénérer 9 pages HTML et pousser
    # un commit — quelques secondes en fonctionnement normal.
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install markdown

      - name: Reconstruire l'arbre du gabarit
        # tree.pkl est un fichier dérivé (il est dans .gitignore) : il doit être
        # reconstruit à partir de template.html à chaque exécution.
        working-directory: build
        run: python parse.py

      - name: Régénérer les 9 pages
        working-directory: build
        run: python generate.py

      - name: Contrôle de sécurité — le formulaire de contact est toujours là
        # Garde-fou : le formulaire Brevo a déjà été perdu une fois par une
        # régénération. Si ce test échoue, on ne publie rien.
        run: |
          grep -q 'data-contact-form' contact/index.html \
            || { echo "::error::Le formulaire de contact a disparu de contact/index.html — publication annulée."; exit 1; }
          grep -q 'name="prenom"' contact/index.html \
            || { echo "::error::Les champs du formulaire ont disparu — publication annulée."; exit 1; }

      - name: Publier les changements
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git add -A
          git commit -m "Régénération automatique du site (nouvel article)"
          git push
